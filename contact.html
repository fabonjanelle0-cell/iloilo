<section class="content">
    <h2>Contact Us</h2>
    <p>
        Do you have questions or suggestions about tourist
        destinations in Iloilo? Send us a message!
    </p>

    <form class="contact-form"
          onsubmit="alert('Thank you for your message! This is a sample form.'); return false;">

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="message">Your Message</label>
        <textarea id="message" rows="5"
                  placeholder="Write your message here" required></textarea>

        <button type="submit">Send Message</button>
    </form>

    <p class="contact-note">
        Explore Iloilo | Tourism Information Website
    </p>
</section>
